# 演示用：30 台设备（20 台加工中心 + 10 台空压机），验证紧凑列表在设备量放大后的行高/字号稳定性
# 通过 CNCOPS_DEVICES_YAML 环境变量切换，不影响正式 config/devices.yaml
schema_version: 2
line: "LINE-01 仿真加工线（30 台演示）"

factories:
  - id: "F001"
    name: "一号工厂"
    tenant_id: "default"
  - id: "F002"
    name: "二号工厂"
    tenant_id: "default"

devices:
  - id: "CNC-01"
    factory_id: "F001"
    name: "一号加工中心"
    type: "cnc"
    location: "LINE-01 / F001 演示位"
    key_points: ["spindle_temp", "spindle_vib", "spindle_load", "coolant_flow"]
    aliases:
      - "CNC-01"
      - "cnc-01"
      - "CNC1"
      - "一号机"
      - "1号机"
      - "一号加工中心"
    points:
      - key: "spindle_temp"
        label: "主轴温度"
        unit: "°C"
      - key: "spindle_vib"
        label: "主轴振动"
        unit: "mm/s"
      - key: "spindle_load"
        label: "主轴负载"
        unit: "%"
      - key: "spindle_speed"
        label: "主轴转速"
        unit: "r/min"
      - key: "feed_rate"
        label: "进给速度"
        unit: "mm/min"
      - key: "inlet_air_pressure"
        label: "本机进气压力"
        unit: "MPa"
      - key: "coolant_flow"
        label: "冷却液流量"
        unit: "L/min"
      - key: "status"
        label: "运行状态"
        unit: ""
      - key: "alarm_code"
        label: "设备报警码"
