# 口语同义词词典：把大白话映射到具体测点，解析器据此做症状扩展
# 同一说法出现在多个测点属正常现象，最终会结合设备类型收敛
schema_version: 1

synonyms:
  spindle_temp: ["发烫", "烫手", "发热", "温度高", "过热", "热", "温升", "烫"]
  spindle_vib: ["声音不对", "声音异常", "异响", "响声", "震动", "振动", "抖动", "抖", "噪音", "噪声", "嗡嗡", "刺耳", "声音大", "响"]
  spindle_load: ["闷车", "卡住", "负载高", "负载大", "吃刀", "无力", "掉速", "转不动", "带不动"]
  feed_rate: ["进给慢", "走不动", "进给异常", "速度慢", "爬行"]
  spindle_speed: ["转速不对", "转速掉", "转速不稳"]
  coolant_flow: ["不出水", "冷却液", "没水", "液位低", "冷却不足", "水泵"]
  inlet_air_pressure: ["没气", "气压低", "气压不足", "气不够", "夹不紧", "换刀无力", "气缸不动"]

  discharge_temp: ["排气温度", "高温", "排气热", "温度高", "过热"]
  outlet_pressure: ["压力上不去", "没劲儿", "没劲", "打不上压", "供气不足", "压力低", "压力不足"]
  oil_temp: ["油温", "润滑油温"]
  motor_current: ["电流高", "电流大", "跳闸", "过载", "电机热"]
  load_rate: ["满载", "加载", "一直加载"]
  run_hours: ["保养", "运行小时", "换油", "到期"]

# 模糊描述：命中后说明"未识别到具体症状"，系统改用数据驱动（看实时数据超标项）
vague_terms: ["不对劲", "不太对", "有点怪", "怪怪", "不舒服", "有问题", "不正常", "毛病", "不得劲"]

# 需要立即升级为最高安全级别的危险现象词
danger_terms: ["冒烟", "焦糊", "糊味", "烧焦", "起火", "火花", "漏电", "触电", "漏油", "爆"]
