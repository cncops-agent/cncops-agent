# 演示用：10 台设备（7 台加工中心 + 3 台空压机）
# 通过 CNCOPS_DEVICES_YAML 环境变量切换，不影响正式 config/devices.yaml
schema_version: 2
line: "LINE-01 仿真加工线"

# 工厂目录（多工厂演示）：一号工厂 5 台、二号工厂 5 台；tenant_id 为多租户预留
factories:
  - id: "F001"
    name: "一号工厂"
    tenant_id: "default"
  - id: "F002"
    name: "二号工厂"
    tenant_id: "default"

devices:
  - id: "CNC-01"
    factory_id: "F001"
    name: "一号加工中心"
    type: "cnc"
    location: "LINE-01 / 工位A"
    key_points: ["spindle_temp", "spindle_vib", "spindle_load", "coolant_flow"]
    aliases:
      - "一号机"
      - "1号机"
      - "一号"
      - "1号"
      - "cnc01"
      - "cnc-01"
      - "CNC1"
      - "1号机"
      - "一号加工中心"
    points:
      - key: "spindle_temp"
        label: "主轴温度"
        unit: "°C"
      - key: "spindle_vib"
        label: "主轴振动"
        unit: "mm/s"
      - key: "spindle_load"
        label: "主轴负载"
        unit: "%"
      - key: "spindle_speed"
        label: "主轴转速"
        unit: "r/min"
      - key: "feed_rate"
        label: "进给速度"
        unit: "mm/min"
      - key: "inlet_air_pressure"
        label: "本机进气压力"
        unit: "MPa"
      - key: "coolant_flow"
        label: "冷却液流量"
        unit: "L/min"
      - key: "status"
        label: "运行状态"
        unit: ""
      - key: "alarm_code"
        label: "设备报警码"
        unit: ""

