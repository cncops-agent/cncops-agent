# CNC 加工中心故障知识条目（自制通用运维常识，source=internal，不复制任何厂商 proprietary 手册）
# 字段说明：
#   code               : 故障编号，界面报告卡上的角标（如 F001），点击可看本条目详情
#   alarm_codes/points : 用于与实时数据证据做结构化匹配
#   symptoms           : 口语同义词，用于关键词检索
#   steps[].level      : L1 操作工 / L2 维修工 / L3 工程师；执行时仍会被 safety.py 强制升级
#   steps[].tools      : 该步骤所需工具（含"需持证/工程师"提示）
#   steps[].materials  : 该步骤所需物料/备件
#   steps[].eta_min    : 预计耗时（分钟），界面直接展示，供排产与工时估算
entries:
  - id: "KB-CNC-001"
    code: "F001"
    title: "主轴温度过高"
    device_types: ["cnc"]
    alarm_codes: ["ALM-101"]
    points: ["spindle_temp", "coolant_flow", "spindle_load"]
    symptoms: ["发烫", "烫手", "温度高", "过热", "主轴热", "温度高报警", "热得厉害"]
    base_probability: 0.92
    conclusion: "主轴温度越过报警阈值，判定为主轴过热异常，需立即降温并排查冷却与润滑。"
    causes:
      - text: "冷却液流量不足或喷嘴堵塞、未对准切削点"
        basis: "冷却液流量同时低于阈值，是主轴过热最常见的直接原因"
      - text: "主轴轴承润滑不良或轴承磨损，摩擦生热"
        basis: "温度持续升高且常伴随振动烈度上升"
      - text: "长时间高负载切削造成热累积"
        basis: "主轴负载读数偏高时热量无法及时散发"
    steps:
      - level: "L1"
        text: "在操作面板记录当前报警码、主轴温度与冷却液流量读数并拍照留存。"
        tools: ["手机（拍照）", "设备点检表"]
        materials: []
        eta_min: 2
      - level: "L1"
        text: "按进给保持并让主轴低速空转 3~5 分钟降温，禁止徒手触摸主轴与刀具。"
        tools: []
        materials: []
        eta_min: 5
      - level: "L1"
        text: "检查冷却液箱液位是否到位、管路有无弯折泄漏、喷嘴是否对准切削点。"
        tools: ["手电筒"]
        materials: []
        eta_min: 5
      - level: "L2"
        text: "清理冷却液滤网与水箱沉渣，疏通喷嘴，恢复流量后复测主轴温度。"
        tools: ["滤网清洗刷", "水桶", "活动扳手"]
        materials: ["冷却液（按配比）", "清洗剂"]
        eta_min: 25
      - level: "L2"
        text: "检查主轴润滑油路油位与油压，按要求补充主轴润滑油并记录加注量。"
        tools: ["油枪", "内六角扳手"]
        materials: ["主轴润滑油（规定牌号）"]
        eta_min: 20
      - level: "L3"
        text: "复测仍超温时，需工程师拆机检查主轴轴承、冷却回路与温控回路，涉及主轴拆装与电气柜带电检测。"
        tools: ["工程师专用：拉马、轴承加热器、红外测温仪、百分表", "电工仪表（需持证）"]
        materials: ["主轴轴承备件", "润滑脂"]
        eta_min: 240
    safety:
      - "主轴及刀具高温，停机后须等待完全冷却方可接触。"
      - "涉及主轴拆装、电气柜与带电检测必须由专业工程师执行，执行前断电挂牌上锁（LOTO）。"

  - id: "KB-CNC-002"
    code: "F002"
    title: "主轴振动或异响"
    device_types: ["cnc"]
    alarm_codes: ["ALM-102"]
    points: ["spindle_vib", "spindle_load", "spindle_speed"]
    symptoms: ["声音不对", "异响", "响声", "震动", "振动", "抖动", "抖", "噪音", "噪声", "嗡嗡", "刺耳"]
    base_probability: 0.88
    conclusion: "主轴振动烈度越过报警阈值，判定为主轴振动异常，需检查刀具与主轴动平衡。"
    causes:
      - text: "刀具磨损、崩刃或刀柄夹持不牢"
        basis: "振动伴随负载波动，换刀后通常明显改善"
      - text: "主轴动平衡失稳或轴承磨损"
        basis: "振动烈度持续偏高且与转速相关"
      - text: "工件装夹不牢或夹具松动"
        basis: "低速与高速段均有周期性异响"
    steps:
      - level: "L1"
        text: "记录报警码、当前转速与振动读数，观察异响是否随转速变化。"
        tools: ["设备点检表"]
        materials: []
        eta_min: 3
      - level: "L1"
        text: "停机后目视检查刀具刃口是否崩缺、刀柄与夹头是否夹紧、工件装夹是否牢靠。"
        tools: ["手电筒", "放大镜（10 倍）"]
        materials: []
        eta_min: 8
      - level: "L1"
        text: "清理主轴锥孔与刀柄锥面的切屑和油污后重新装刀试切。"
        tools: ["不掉毛擦布", "气枪"]
        materials: ["清洗剂"]
        eta_min: 10
      - level: "L2"
        text: "更换新刀具并复测振动值，若数值回落则判定为刀具问题。"
        tools: ["换刀扳手", "扭力扳手"]
        materials: ["同规格新刀具"]
        eta_min: 20
      - level: "L2"
        text: "检查并复紧夹具、地脚螺栓与防护罩固定螺钉。"
        tools: ["扭力扳手", "内六角扳手套装"]
        materials: []
        eta_min: 25
      - level: "L3"
        text: "振动仍超限时，需工程师做主轴动平衡校正与轴承检查，涉及主轴拆装与精度检测。"
        tools: ["工程师专用：动平衡仪、振动分析仪、百分表", "主轴拆装专用工装"]
        materials: ["主轴轴承备件", "润滑脂"]
        eta_min: 300
    safety:
      - "检查前必须停机，严禁在主轴旋转时打开防护门或伸手进入加工区。"
      - "主轴动平衡校正与轴承更换涉及拆机与精度检测，须由工程师或厂家执行。"

  - id: "KB-CNC-003"
    code: "F003"
    title: "主轴负载过高或闷车"
    device_types: ["cnc"]
    alarm_codes: ["ALM-103", "ALM-106"]
    points: ["spindle_load", "feed_rate", "spindle_temp", "spindle_speed"]
    symptoms: ["闷车", "卡住", "负载高", "吃刀", "走不动", "无力", "掉速", "转速掉", "进给慢"]
    base_probability: 0.85
    conclusion: "主轴负载与进给速度同时越限，判定为切削负载过高或机械卡滞（闷车）风险。"
    causes:
      - text: "切削参数过大或刀具磨损导致切削阻力上升"
        basis: "负载高同时进给掉速，典型切削过载表现"
      - text: "导轨、丝杠卡滞或润滑不良造成机械阻力"
        basis: "掉速明显且伴随异响与振动"
      - text: "工件材质异常或毛坯余量过大"
        basis: "更换批次后突然出现"
    steps:
      - level: "L1"
        text: "按进给保持并退出切削，记录负载、进给与转速读数。"
        tools: ["设备点检表"]
        materials: []
        eta_min: 3
      - level: "L1"
        text: "检查程序中的切削深度、进给倍率是否被误调高，必要时降低倍率至 60% 试运行。"
        tools: ["操作面板"]
        materials: []
        eta_min: 10
      - level: "L1"
        text: "检查刀具磨损情况与工件装夹状态。"
        tools: ["手电筒", "放大镜（10 倍）"]
        materials: []
        eta_min: 8
      - level: "L2"
        text: "更换磨损刀具，按材质重新核定切削参数后小切深试切。"
        tools: ["换刀扳手", "扭力扳手"]
        materials: ["新刀具", "切削参数对照表"]
        eta_min: 30
      - level: "L2"
        text: "检查导轨与丝杠润滑状况，清理切屑并补充润滑油。"
        tools: ["油枪", "铜刮刀", "不掉毛擦布"]
        materials: ["导轨润滑油", "清洗剂"]
        eta_min: 30
      - level: "L3"
        text: "若仍反复过载，需工程师检查伺服驱动、丝杠预紧与机械传动，涉及带电检测与参数整定。"
        tools: ["工程师专用：万用表/钳形表（需持证）", "伺服调试终端", "百分表"]
        materials: ["丝杠/联轴器备件（视检查结果）"]
        eta_min: 180
    safety:
      - "闷车状态下严禁强行提高进给或反复启动，防止刀具断裂飞出。"
      - "伺服驱动与电气柜参数的整定属于带电作业，必须由专业工程师执行。"

  - id: "KB-CNC-004"
    code: "F004"
    title: "冷却液流量不足"
    device_types: ["cnc"]
    alarm_codes: ["ALM-105"]
    points: ["coolant_flow", "spindle_temp"]
    symptoms: ["没冷却液", "不出水", "冷却液少", "液位低", "水泵不转", "冷却不足"]
    base_probability: 0.8
    conclusion: "冷却液流量低于阈值，判定为冷却供给不足，需补液并排查泵与管路。"
    causes:
      - text: "冷却液箱液位过低或滤网堵塞"
        basis: "流量低且泵运行声音异常"
      - text: "冷却泵故障或管路弯折泄漏"
        basis: "液位正常但流量仍低"
    steps:
      - level: "L1"
        text: "查看冷却液箱液位，低于下限则按配比补充冷却液。"
        tools: ["量杯", "配比桶"]
        materials: ["冷却液浓缩液", "自来水/纯水"]
        eta_min: 15
      - level: "L1"
        text: "检查管路有无弯折、接头泄漏，喷嘴阀是否误关。"
        tools: ["手电筒"]
        materials: []
        eta_min: 6
      - level: "L2"
        text: "清理滤网与水箱沉渣，排气后复测流量。"
        tools: ["滤网清洗刷", "水桶", "活动扳手"]
        materials: ["清洗剂"]
        eta_min: 30
      - level: "L3"
        text: "泵体无输出时，需工程师检查冷却泵电机与电气控制回路，涉及带电检测。"
        tools: ["电工专用：万用表/钳形表（需持证）", "泵体拆装工具"]
        materials: ["冷却泵备件（视检查结果）", "密封件"]
        eta_min: 120
    safety:
      - "补充冷却液时避免皮肤长时间接触，戴防护手套。"
      - "泵电机与电气回路检测属于带电作业，须由专业工程师执行。"

  - id: "KB-CNC-006"
    code: "F006"
    title: "主轴轴承磨损（振动并发热）"
    device_types: ["cnc"]
    alarm_codes: ["ALM-101", "ALM-102"]
    points: ["spindle_vib", "spindle_temp", "spindle_load"]
    # 症状词刻意避开"发烫/温度/振动/异响"等单条目专属词，避免抢走单一症状场景的 Top-1
    symptoms: ["又响又烫", "轴承磨损", "轴承坏", "轴承响", "又振又热", "主轴轴承", "发热还响"]
    base_probability: 0.9
    conclusion: "主轴振动与温度同时越限，判定为主轴轴承磨损或润滑失效，需尽快安排轴承检查，防止主轴精度丧失。"
    causes:
      - text: "主轴轴承磨损或预紧失效，摩擦生热并引发振动"
        basis: "振动与温度同时越限是轴承磨损的典型组合特征"
      - text: "主轴润滑油脂劣化、油路堵塞导致润滑失效"
        basis: "温升快且伴随周期性异响，低速段尤为明显"
      - text: "长期高负载切削加速轴承疲劳"
        basis: "主轴负载持续处于高位"
    steps:
      - level: "L1"
        text: "记录报警码、主轴温度、振动值与负载读数，停机并等待主轴自然降温。"
        tools: ["红外测温仪", "设备点检表"]
        materials: []
        eta_min: 15
      - level: "L1"
        text: "目视检查主轴前端是否有渗漏、油渍与异常温升痕迹，监听空转异响是否随转速变化。"
        tools: ["手电筒", "听诊棒（或螺丝刀代用）"]
        materials: []
        eta_min: 10
      - level: "L2"
        text: "按润滑规程检查主轴润滑油路与油脂状态，必要时补充规定牌号润滑脂并记录加注量。"
        tools: ["油枪", "内六角扳手"]
        materials: ["主轴润滑脂（规定牌号）"]
        eta_min: 20
      - level: "L2"
        text: "降低切削参数与主轴转速至 70% 试运行，复测振动与温度是否回落。"
        tools: ["操作面板"]
        materials: []
        eta_min: 20
      - level: "L3"
        text: "仍同时超限时，需工程师做主轴轴承检查与更换、主轴精度与动平衡复校，涉及主轴拆装与精度检测。"
        tools: ["工程师专用：主轴拆装工装、拉马、百分表、动平衡仪"]
        materials: ["主轴轴承成套备件", "润滑脂"]
        eta_min: 360
    safety:
      - "主轴高温且存在旋转部件，检查前必须停机并等待完全冷却，严禁徒手触摸。"
      - "主轴轴承更换与精度复校涉及拆机与精密检测，必须由专业工程师或设备厂家执行。"

  - id: "KB-CNC-005"
    code: "F005"
    title: "本机进气压力不足"
    device_types: ["cnc"]
    alarm_codes: ["ALM-104"]
    points: ["inlet_air_pressure"]
    symptoms: ["没气", "气压低", "压力不足", "气不够", "换刀无力", "夹不紧", "气缸不动"]
    base_probability: 0.82
    conclusion: "本机进气压力低于阈值，判定为气源供给不足，需由气源端向本机逐级排查。"
    causes:
      - text: "上游空压机出口压力不足或管网泄漏"
        basis: "同类时段多台设备同时报气压低"
      - text: "本机气路滤芯堵塞、气管弯折或接头漏气"
        basis: "仅本机压力偏低，其他设备正常"
    steps:
      - level: "L1"
        text: "查看本机压力表读数并与上位空压机出口压力对比，记录差值。"
        tools: ["本机压力表", "对讲机（联系动力站）"]
        materials: []
        eta_min: 5
      - level: "L1"
        text: "检查本机气管有无弯折、接头松动，听是否有漏气声。"
        tools: ["手电筒", "听诊棒（或螺丝刀代用）"]
        materials: ["扎带"]
        eta_min: 10
      - level: "L2"
        text: "排空滤杯积水、更换本机气路滤芯后复测压力。"
        tools: ["活动扳手", "水杯"]
        materials: ["气路滤芯（同规格）", "生料带"]
        eta_min: 25
      - level: "L2"
        text: "通知动力站核查空压机出口压力与干燥机状态。"
        tools: ["对讲机/电话"]
        materials: []
        eta_min: 10
      - level: "L3"
        text: "管网保压仍不合格时，需工程师做管路检漏与减压阀整定，涉及带压管路作业。"
        tools: ["工程师专用：检漏液/超声波检漏仪", "管钳", "压力表校验仪"]
        materials: ["密封件", "减压阀备件（视检查结果）"]
        eta_min: 120
    safety:
      - "禁止在带压状态下拆卸气管接头，必须先泄压。"
      - "带压管路检漏与减压阀整定须由专业工程师执行。"
