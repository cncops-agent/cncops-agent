# 设备与点位目录（catalog）：仿真产线 1 条、3 台设备
# 设计约束：每台设备的点位命名空间完全独立，空压机 AIR-01 绝不复用 CNC 的点位（规避旧项目"节点借用"问题）
schema_version: 2
line: "LINE-01 仿真加工线"

# 工厂目录（多工厂预留）：一台设备归属一个工厂；tenant_id 为多租户预留，当前同属 default 租户
factories:
  - id: "F001"
    name: "一号工厂"
    tenant_id: "default"

devices:
  - id: "CNC-01"
    factory_id: "F001"
    name: "一号加工中心"
    type: "cnc"
    location: "LINE-01 / 工位A"
    key_points: ["spindle_temp", "spindle_vib", "spindle_load", "coolant_flow"]   # 设备卡只显示这几个关键读数（界面左侧一次能看完）
    aliases:
      - "一号机"
      - "1号机"
      - "一号"
      - "1号"
      - "cnc01"
      - "cnc-01"
      - "CNC1"
      - "一号加工中心"
    points:
      - key: "spindle_temp"
        label: "主轴温度"
        unit: "°C"
      - key: "spindle_vib"
        label: "主轴振动"
        unit: "mm/s"
      - key: "spindle_load"
        label: "主轴负载"
        unit: "%"
      - key: "spindle_speed"
        label: "主轴转速"
        unit: "r/min"
      - key: "feed_rate"
        label: "进给速度"
        unit: "mm/min"
      - key: "inlet_air_pressure"
        label: "本机进气压力"
        unit: "MPa"
      - key: "coolant_flow"
        label: "冷却液流量"
        unit: "L/min"
      - key: "status"
        label: "运行状态"
        unit: ""
      - key: "alarm_code"
        label: "设备报警码"
        unit: ""

  - id: "CNC-02"
    factory_id: "F001"
    name: "二号加工中心"
    type: "cnc"
    location: "LINE-01 / 工位B"
    key_points: ["spindle_temp", "spindle_vib", "spindle_load", "coolant_flow"]   # 设备卡只显示这几个关键读数（界面左侧一次能看完）
    aliases:
      - "二号机"
      - "2号机"
      - "二号"
      - "2号"
      - "cnc02"
      - "cnc-02"
      - "CNC2"
      - "二机"
      - "二号加工中心"
    points:
      - key: "spindle_temp"
        label: "主轴温度"
        unit: "°C"
      - key: "spindle_vib"
        label: "主轴振动"
        unit: "mm/s"
      - key: "spindle_load"
        label: "主轴负载"
        unit: "%"
      - key: "spindle_speed"
        label: "主轴转速"
        unit: "r/min"
      - key: "feed_rate"
        label: "进给速度"
        unit: "mm/min"
      - key: "inlet_air_pressure"
        label: "本机进气压力"
        unit: "MPa"
      - key: "coolant_flow"
        label: "冷却液流量"
        unit: "L/min"
      - key: "status"
        label: "运行状态"
        unit: ""
      - key: "alarm_code"
        label: "设备报警码"
        unit: ""

  - id: "AIR-01"
    factory_id: "F001"
    name: "一号空压机"
    type: "air_compressor"
    location: "LINE-01 / 动力站"
    key_points: ["outlet_pressure", "discharge_temp", "load_rate"]   # 设备卡只显示这几个关键读数（界面左侧一次能看完）
    aliases:
      - "空压机"
      - "空压机-01"
      - "气泵"
      - "压缩机"
      - "空压"
      - "air01"
      - "air-01"
      - "AIR1"
      - "打气泵"
    points:
      - key: "discharge_temp"
        label: "排气温度"
        unit: "°C"
      - key: "outlet_pressure"
        label: "出口压力"
        unit: "MPa"
      - key: "oil_temp"
        label: "润滑油温度"
        unit: "°C"
      - key: "motor_current"
        label: "电机电流"
        unit: "A"
      - key: "load_rate"
        label: "加载率"
        unit: "%"
      - key: "run_hours"
        label: "累计运行小时"
        unit: "h"
      - key: "status"
        label: "运行状态"
        unit: ""
      - key: "alarm_code"
        label: "设备报警码"
        unit: ""
